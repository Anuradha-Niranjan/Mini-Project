<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Day17.css">
</head>
<body>
    <form>
        <h1>SIGNUP FORM</h1>
        <label for="name">First Name :</label>
        <input type="text" id="name" placeholder="Enter First Name"/>
        <span id="f-name error" class="errors"></span>
      
      
        <label for="last">Last Name :</label>
        <input type="text"  id="last" placeholder="Enter Last Name"/>
        <span id="l-name error" class="errors"></span>
  
      
      
        <label for="mail">Email :</label>
        <input type="email" id="mail" placeholder="Email Email"/>
        <span id="email error" class="errors"></span>
  
      
      
        <label for="number">Mobile Number :</label>
        <input type="number" id="number" placeholder="Enter your Mobile Number "/>
        <span id="number error" class="errors"></span>
  
      
      
        <label for="passcode">Password</label>
        <input type="password" id="passcode" placeholder="Enter Password">
        <span id="password error" class="errors"></span>
  
      
      
        <button type="submit">Submit form</button>
      
      
      </form>

    <Script src="Day17.js"></Script>
</body>
</html>
